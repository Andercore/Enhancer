name: Sync fork with upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync master with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo sync Andercore/Enhancer --source k1tbyte/Wand-Enhancer --branch master
